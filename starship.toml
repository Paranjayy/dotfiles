# Starship Configuration | High-Vibrancy Edition
# ============================================

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
style = "bold #7dcfff"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"

[git_branch]
symbol = " "
style = "bold #7aa2f7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #bb9af7"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "💥 $count "
ahead = "⬆️ $count "
behind = "⬇️ $count "
diverged = "🚦 A=$ahead_count B=$behind_count "
untracked = "🆕 $count "
stashed = "📦 $count "
modified = "📝 $count "
staged = "✅ $count "
renamed = "🚚 $count "
deleted = "🗑️ $count "

[character]
success_symbol = "[❯](bold #7dcfff)"
error_symbol = "[❯](bold #f7768e)"
vicmd_symbol = "[❮](bold #7aa2f7)"

[cmd_duration]
min_time = 0
format = "took [󱎫 $duration](bold #7aa2f7)"
